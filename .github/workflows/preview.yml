name: Vercel Preview

on:
  push:
    branches:
      - develop
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

# Skip wave-orchestrator fix branches entirely
  # (e.g. fix/issue-123, fix/issue-456 — wave orchestrator uses this naming)
  # These land via merge wave PRs; they don't need individual Vercel previews.
  # The main wave PR that merges to develop will trigger a deploy.

# Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

concurrency:
  group: vercel-preview-${{ github.ref }}
  cancel-in-progress: true

# Only deploy if:
#   - push to develop branch (production-like preview)
#   - PR title contains [vercel] or [deploy] (opt-in)
#   - NOT from fix/issue-NNN branches (wave orchestrator cleanup branches)
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    if: |
      (
        github.event_name == 'push' && github.ref == 'refs/heads/develop'
      ) || (
        github.event_name == 'pull_request' && (
          contains(github.event.pull_request.title, '[vercel]') ||
          contains(github.event.pull_request.title, '[deploy]')
        )
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (Preview)
        run: |
          vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} | tee vercel-url.txt

      - name: Comment PR with preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const url = fs.readFileSync('vercel-url.txt', 'utf8').trim();
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Vercel Preview Deployment\n\n:white_check_mark: Preview ready: ${url}`
            });
