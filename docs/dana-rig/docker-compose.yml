name: dana-rig

# One-command Dana rig:
#   export UX_PROTO_REPO=$HOME/staging-studio DANA_RIG=$HOME/dana-rig
#   export DANA_PHOTO_DIR=$HOME/dana-rig/photos   # put living-room.jpg inside
#   export GID=$(id -g)
#   docker compose up --build
#
# Then point your agent at http://127.0.0.1:39999 with dana-prompt.md.
# Stop with: docker compose down   (add -v to also wipe the database)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: uxproto
      POSTGRES_PASSWORD: uxproto
      POSTGRES_DB: staging_studio_ux
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uxproto -d staging_studio_ux"]
      interval: 5s
      timeout: 3s
      retries: 20

  mock:
    build:
      context: ./docker
      dockerfile: Dockerfile.mock
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ${UX_PROTO_REPO}:/repo:ro
    ports:
      - "39912:39912"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:39912/__e2e/storage -o /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  setup:
    build:
      context: ./docker
      dockerfile: Dockerfile.app
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ${UX_PROTO_REPO}:/repo
      - app-node-modules:/repo/node_modules
      - .:/rig:ro
    environment:
      DATABASE_URL: postgresql://uxproto:uxproto@db:5432/staging_studio_ux
      npm_config_cache: /tmp/npm-cache
    depends_on:
      db:
        condition: service_healthy
    # Push schema + seed, then exit. App waits for this to succeed.
    entrypoint:
      - bash
      - -c
      - |
        set -euo pipefail
        cd /repo
        if [ ! -x node_modules/.bin/next ]; then
          echo "[dana-rig] installing dependencies (first run only, a few minutes)..."
          npm ci --no-audit --no-fund
        fi
        npx prisma generate
        UX_PROTO_SETUP_ONESHOT=1 UX_PROTO_REPO=/repo npx tsx /rig/setup.ts

  app:
    build:
      context: ./docker
      dockerfile: Dockerfile.app
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "39901:39901"
    volumes:
      - ${UX_PROTO_REPO}:/repo
      - app-node-modules:/repo/node_modules
      - app-next-data:/repo/.next
      - .:/rig:ro
    environment:
      DATABASE_URL: postgresql://uxproto:uxproto@db:5432/staging_studio_ux
      NEXT_PUBLIC_SUPABASE_URL: http://mock:39912
      NEXT_PUBLIC_SUPABASE_ANON_KEY: uxproto-anon-key
      OPENAI_API_KEY: uxproto-dummy
      FAL_KEY: uxproto-dummy
      BROWSERLESS_API_KEY: uxproto-dummy
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:39901
      PREVIEW_TOKEN_SECRET: uxproto-dev-secret-not-real
      UX_PROTO_MOCK_FAL: "1"
      UX_PROTO_MOCK_RESULT_URL: http://mock:39912/storage/v1/object/public/staged-results/e2e-staged.png
      npm_config_cache: /tmp/npm-cache
    depends_on:
      db:
        condition: service_healthy
      mock:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:39901/login -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      default:
        aliases:
          - web

  obscura:
    # Obscura is the Rust/V8 headless browser that replaces Playwright's
    # bundled Chromium. Exposes CDP on port 9222 over the docker network so
    # the `driver` service can `chromium.connectOverCDP("ws://obscura:9222")`.
    # The OBSCURA_CDP_TOKEN gates inbound CDP sessions; the driver passes
    # the same value in the Authorization header. Image is published on
    # Docker Hub as h4ckf0r0day/obscura (Apache-2.0).
    image: h4ckf0r0day/obscura
    environment:
      OBSCURA_CDP_TOKEN: ${OBSCURA_CDP_TOKEN:-uxproto-dev-token}
    # Note: no ports published to the host. The driver connects in-network.
    # When the browser navigates to the app, it MUST use the docker-network
    # hostname (e.g. http://web:39901) — Obscura's 127.0.0.1 is itself, not
    # the host. UX_PROTO_BROWSER_APP_URL below controls that.

  driver:
    build:
      context: ./docker
      dockerfile: Dockerfile.driver
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "39999:39999"
    volumes:
      - ./driver.js:/rig/driver.js:ro
      - ${DANA_PHOTO_DIR:-./photos}:/photos:ro
      - ./docker/shots:/shots
    environment:
      HOME: /tmp
      # What the relay reports as the "current URL" (driver container's view).
      UX_PROTO_APP_URL: ${UX_PROTO_APP_URL:-http://127.0.0.1:39901}
      # What the BROWSER actually navigates to. When using Obscura, the
      # browser is in its own container, so 127.0.0.1 doesn't reach the app;
      # use the docker-network hostname (`web`, the alias on the default
      # network from the `app` service).
      UX_PROTO_BROWSER_APP_URL: ${UX_PROTO_BROWSER_APP_URL:-http://web:39901}
      UX_PROTO_RELAY_HOST: 0.0.0.0
      UX_PROTO_SHOT_DIR: /shots
      UX_PROTO_CHROMIUM_ARGS: --no-sandbox
      # CDP connection. Set UX_PROTO_CDP_URL=ws://127.0.0.1:9222 to run Obscura
      # on the host (e.g. via `docker run -p 9222:9222 h4ckf0r0day/obscura`).
      # Inside compose, the default `ws://obscura:9222` reaches the sidecar.
      UX_PROTO_CDP_URL: ${UX_PROTO_CDP_URL:-ws://obscura:9222}
      UX_PROTO_CDP_TOKEN: ${OBSCURA_CDP_TOKEN:-uxproto-dev-token}
    depends_on:
      app:
        condition: service_healthy
      obscura:
        condition: service_started

volumes:
  db-data:
  app-node-modules:
  app-next-data:
